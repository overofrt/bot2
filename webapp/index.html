<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Запрошення на побачення</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #12100e;
      color: #f2eee6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
      min-height: 100vh;
    }
    .card {
      background: #1a1714;
      border: 1px solid #4b3f2a;
      border-radius: 20px;
      padding: 20px;
      max-width: 480px;
      margin: 0 auto;
    }
    h1 {
      color: #daba6a;
      font-size: 22px;
      margin-bottom: 6px;
    }
    .sub {
      color: #a59e91;
      font-size: 14px;
      margin-bottom: 20px;
    }
    label {
      display: block;
      font-size: 13px;
      color: #daba6a;
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }
    .option {
      background: #231f1b;
      border: 1px solid #3a3122;
      border-radius: 12px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      font-size: 14px;
      transition: 0.15s;
    }
    .option.active {
      border-color: #daba6a;
      background: #2e271c;
      color: #daba6a;
      font-weight: 600;
    }
    .style-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }
    .btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, #e2c484, #c59b47);
      color: #12100e;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
    .result {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #231f1b;
      border: 1px dashed #daba6a;
      display: none;
      word-break: break-all;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>💌 Створити запрошення</h1>
    <p class="sub">Обери місто та настрій — бот згенерує персональне посилання</p>

    <label>1. Місто зустрічі</label>
    <div class="grid" id="cities"></div>

    <label>2. Стиль спілкування</label>
    <div class="style-list" id="styles">
      <div class="option active" data-style="romantic">🌹 Романтичний</div>
      <div class="option" data-style="flirt">😉 З гумором / легкий флірт</div>
    </div>

    <button class="btn" id="createBtn">Згенерувати запрошення</button>

    <div class="result" id="resultBox"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    let selectedCity = "";
    let selectedStyle = "romantic";

    async function loadCities() {
      const res = await fetch("/api/cities");
      const data = await res.json();
      const box = document.getElementById("cities");
      box.innerHTML = "";
      data.cities.forEach((city, idx) => {
        const el = document.createElement("div");
        el.className = "option" + (idx === 0 ? " active" : "");
        el.textContent = "📍 " + city;
        if (idx === 0) selectedCity = city;
        el.onclick = () => {
          document.querySelectorAll("#cities .option").forEach(x => x.classList.remove("active"));
          el.classList.add("active");
          selectedCity = city;
        };
        box.appendChild(el);
      });
    }

    document.querySelectorAll("#styles .option").forEach(el => {
      el.onclick = () => {
        document.querySelectorAll("#styles .option").forEach(x => x.classList.remove("active"));
        el.classList.add("active");
        selectedStyle = el.dataset.style;
      };
    });

    document.getElementById("createBtn").onclick = async () => {
      const userId = tg.initDataUnsafe?.user?.id || 0;
      const res = await fetch("/api/invites", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sender_tg_id: userId,
          city_name: selectedCity,
          style: selectedStyle
        })
      });
      const data = await res.json();
      const box = document.getElementById("resultBox");
      box.style.display = "block";
      box.innerHTML = `<b>Готово!</b> Перешли це посилання:<br><br><code>${data.invite_link}</code>`;
    };

    loadCities();
  </script>
</body>
</html>
