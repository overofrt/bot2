<script>
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
    }

    const urlParams = new URLSearchParams(window.location.search);
    const inviteCode = urlParams.get("invite") || tg?.initDataUnsafe?.start_param || "";

    let selectedCity = "Київ";
    let selectedStyle = "romantic";
    const surveyState = {
      food: "Кава та десерти",
      activity: "Прогулянка ввечері",
      day: "Сьогодні",
      time_slot: "17:00",
    };

    function switchTab(tab) {
      const isCreate = tab === "create";
      document.getElementById("tabCreate").classList.toggle("active", isCreate);
      document.getElementById("tabSurvey").classList.toggle("active", !isCreate);
      document.getElementById("panelCreate").classList.toggle("hidden", !isCreate);
      document.getElementById("panelSurvey").classList.toggle("hidden", isCreate);
    }

    function selectStyle(el) {
      document.querySelectorAll("#stylesStack .pill").forEach((b) => b.classList.remove("active"));
      el.classList.add("active");
      selectedStyle = el.dataset.val;
    }

    function pickOption(field, el, containerId) {
      document.querySelectorAll(`#${containerId} .pill`).forEach((b) => b.classList.remove("active"));
      el.classList.add("active");
      surveyState[field] = el.dataset.val;
    }

    async function loadCities() {
      const grid = document.getElementById("citiesGrid");
      try {
        const res = await fetch("/api/cities");
        const data = await res.json();
        const cities = data.cities?.length ? data.cities : ["Київ", "Львів"];
        grid.innerHTML = "";
        cities.forEach((city, idx) => {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "pill center" + (idx === 0 ? " active" : "");
          btn.textContent = "📍 " + city;
          if (idx === 0) selectedCity = city;
          btn.onclick = () => {
            document.querySelectorAll("#citiesGrid .pill").forEach((x) => x.classList.remove("active"));
            btn.classList.add("active");
            selectedCity = city;
          };
          grid.appendChild(btn);
        });
      } catch {
        grid.innerHTML = `<button type="button" class="pill center active">📍 Київ</button>`;
      }
    }

    async function generateInvite() {
      const senderId = tg?.initDataUnsafe?.user?.id || 0;
      const res = await fetch("/api/invites", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          sender_tg_id: senderId,
          city_name: selectedCity,
          style: selectedStyle,
        }),
      });
      const data = await res.json();
      const box = document.getElementById("inviteResult");
      const codeEl = document.getElementById("generatedLink");
      const link = data.bot_link || data.webapp_link;
      codeEl.textContent = link;
      box.classList.add("show");

      if (!data.sender_saved) {
        box.insertAdjacentHTML(
          "beforeend",
          `<div style="font-size:12px;color:#ffb4a2;margin-top:8px;">⚠️ Відкрий Mini App саме всередині Telegram, щоб бот знав твій ID і міг надіслати тобі відповідь.</div>`
        );
      }

      if (navigator.clipboard && link) {
        try {
          await navigator.clipboard.writeText(link);
        } catch {}
      }
    }

    async function submitSurvey() {
      const note = document.getElementById("noteInput").value.trim();
      const box = document.getElementById("surveyResult");
      const user = tg?.initDataUnsafe?.user || {};
      const guestName = [user.first_name, user.last_name].filter(Boolean).join(" ");
      const guestUsername = user.username || "";

      if (!inviteCode) {
        box.classList.add("show");
        box.innerHTML = `<span style="color: var(--gold-bright);">Немає коду запрошення у посиланні.</span><br>Перейди за посиланням від людини, яка тебе запросила.`;
        return;
      }

      const res = await fetch(`/api/invites/${encodeURIComponent(inviteCode)}/complete`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          ...surveyState,
          note,
          guest_name: guestName,
          guest_username: guestUsername,
        }),
      });
      const data = await res.json();
      box.classList.add("show");
      if (data.ok) {
        box.innerHTML = `<b style="color: var(--gold-bright);">Готово!</b> Твій вибір (місце, їжа, час і нотатка) надіслано людині, яка тебе запросила.`;
      } else {
        box.innerHTML = `<span style="color:#ffb4a2;">Помилка: ${data.error || "не вдалося надіслати"}</span>`;
      }
    }

    async function initInviteContext() {
      if (!inviteCode) return;
      try {
        const res = await fetch(`/api/invites/${encodeURIComponent(inviteCode)}`);
        if (!res.ok) return;
        const data = await res.json();
        document.getElementById("surveyContext").textContent =
          `Запрошення #${data.code} · Місто: ${data.city_name}`;
        switchTab("survey");
      } catch {}
    }

    loadCities();
    initInviteContext();
  </script>
</html>
